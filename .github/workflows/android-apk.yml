name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android command-line tools and build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -w /root/src \
            notfl3/cargo-apk /bin/bash -lc '
              set -eu
              SDK_ROOT=/opt/android-sdk-linux
              mkdir -p "$SDK_ROOT/cmdline-tools/latest" /tmp/android-cmdline-tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/android-cmdline-tools.zip
              unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
              cp -R /tmp/android-cmdline-tools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              test -x "$SDKMANAGER"
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
              test -f "$SDK_ROOT/platforms/android-35/android.jar"
              export ANDROID_HOME="$SDK_ROOT"
              export ANDROID_SDK_ROOT="$SDK_ROOT"
              export PATH="$SDK_ROOT/build-tools/35.0.0:$PATH"
              cargo quad-apk build --release
            '

      - name: Collect APK
        run: |
          mkdir -p dist
          find target/android-artifacts/release/apk -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: master-ludo-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
