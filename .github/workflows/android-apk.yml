name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK and Java
        run: |
          test -n "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          java -version

      - name: Build release APK with compatible Rust and Java toolchains
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -v "$ANDROID_HOME:/opt/android-sdk-linux" \
            -v "$JAVA_HOME:/opt/jdk17:ro" \
            -w /root/src \
            -e ANDROID_HOME=/opt/android-sdk-linux \
            -e ANDROID_SDK_ROOT=/opt/android-sdk-linux \
            -e JAVA_HOME=/opt/jdk17 \
            notfl3/cargo-apk /bin/bash -lc '
              set -e
              export JAVA_HOME=/opt/jdk17
              export PATH="$JAVA_HOME/bin:/opt/android-sdk-linux/build-tools/35.0.0:$PATH"
              java -version
              rustup toolchain install 1.87.0 --profile minimal
              rustup target add --toolchain 1.87.0 armv7-linux-androideabi aarch64-linux-android
              rustup default 1.87.0
              rustc --version
              cargo --version
              test -f /opt/android-sdk-linux/platforms/android-35/android.jar
              cargo quad-apk build --release
            '

      - name: Collect APK
        run: |
          mkdir -p dist
          find target/android-artifacts/release/apk -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: master-ludo-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
