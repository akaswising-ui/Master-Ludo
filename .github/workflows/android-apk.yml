name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust game and rules tests
        run: cargo test --all-targets

      - name: Set up Java 8 for cargo-apk javac
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Save Java 8 path
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 17 for Android D8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Save Java 17 path
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK and both JDKs
        run: |
          test -n "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$JAVA8_HOME/jre/lib/rt.jar"
          test -x "$JAVA8_HOME/bin/javac"
          test -x "$JAVA17_HOME/bin/java"
          "$JAVA8_HOME/bin/javac" -version
          "$JAVA17_HOME/bin/java" -version

      - name: Build release APK with compatible Rust and Java toolchains
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -v "$ANDROID_HOME:/opt/android-sdk-linux" \
            -v "$JAVA8_HOME:/opt/jdk8:ro" \
            -v "$JAVA17_HOME:/opt/jdk17:ro" \
            -w /root/src \
            -e ANDROID_HOME=/opt/android-sdk-linux \
            -e ANDROID_SDK_ROOT=/opt/android-sdk-linux \
            -e JAVA_HOME=/opt/jdk8 \
            notfl3/cargo-apk /bin/bash -lc '
              set -eu
              export JAVA_HOME=/opt/jdk8
              export PATH="$JAVA_HOME/bin:/opt/android-sdk-linux/platform-tools:$PATH"
              test -f "$JAVA_HOME/jre/lib/rt.jar"
              test -f /opt/android-sdk-linux/platforms/android-35/android.jar

              # cargo-quad-apk calls D8 directly on modern build-tools.
              # Run its original launcher with Java 17; keep Java 8 for javac.
              for BT_DIR in /opt/android-sdk-linux/build-tools/*; do
                if [ -x "$BT_DIR/d8" ] && [ ! -x "$BT_DIR/d8.original" ]; then
                  mv "$BT_DIR/d8" "$BT_DIR/d8.original"
                  cp /root/src/scripts/android-d8-java17.sh "$BT_DIR/d8"
                  chmod +x "$BT_DIR/d8"
                fi
              done

              rustup toolchain install 1.87.0 --profile minimal
              rustup target add --toolchain 1.87.0 armv7-linux-androideabi aarch64-linux-android
              rustup default 1.87.0
              rustc --version
              cargo --version
              cargo quad-apk build --release
            '

      - name: Collect APK
        run: |
          mkdir -p dist
          find target/android-artifacts/release/apk -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: master-ludo-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
