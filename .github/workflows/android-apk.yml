name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK platform and build tools, then build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -w /root/src \
            notfl3/cargo-apk /bin/bash -lc '
              set -eu
              export ANDROID_SDK_ROOT=/opt/android-sdk-linux
              yes | /opt/android-sdk-linux/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk-linux --licenses >/dev/null
              /opt/android-sdk-linux/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk-linux --install "platforms;android-35" "build-tools;35.0.0"
              test -f /opt/android-sdk-linux/platforms/android-35/android.jar
              export PATH="/opt/android-sdk-linux/build-tools/35.0.0:$PATH"
              cargo quad-apk build --release
            '

      - name: Collect APK
        run: |
          mkdir -p dist
          find target/android-artifacts/release/apk -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: master-ludo-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
