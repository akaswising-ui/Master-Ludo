[package]
name = "master-ludo"
version = "0.1.0"
edition = "2021"
description = "A Rust-only, offline Ludo board game"
license = "MIT"

[dependencies]
macroquad = "0.4.16"

[package.metadata.android]
package_name = "com.akaswising.masterludo"
label = "Master Ludo"
android_version = 36
target_sdk_version = 36
min_sdk_version = 23
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "portrait"
